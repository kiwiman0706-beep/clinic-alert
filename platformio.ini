; クリニック非常ボタン
;   button          : 送信機（M5Stack ATOM Lite）  … 各診察室の机の下
;   receiver        : 受信機（M5Stack Core2）      … 受付
;   receiver_cores3 : 受信機（M5Stack CoreS3）     … Core2 の代わりに使う場合

[platformio]
default_envs = button, receiver

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:button]
board = m5stack-atom
build_src_filter = -<*> +<button/>

[env:receiver]
board = m5stack-core2
build_src_filter = -<*> +<receiver/>
lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0

[env:receiver_cores3]
board = m5stack-cores3
build_src_filter = -<*> +<receiver/>
lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0
